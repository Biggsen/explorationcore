# Stored with every discovery. A blank value refuses new records.
# Changing this later leaves existing rows on their original name.
server-name: Lowothra

database:
  # Relative paths are resolved inside plugins/ExplorationCore/.
  file: exploration.db

# Logs each recorded discovery and each ignored duplicate.
debug: false

# Prefix for player-facing exploration chat notifications.
# Leave blank to disable.
messages:
  prefix: "§6⌖ §r"

# Experience and claim blocks for a structure the moment it is first recorded.
# Turn this on to pay the xp amounts and run claimblocks-command.
# {player} and {amount} are filled in when the command is dispatched.
rewards:
  enabled: false
  claimblocks-command: "acb {player} {amount}"

  structures:
    ancient_city:
      xp: 500
      claimblocks: 50
    buried_treasure:
      xp: 130
      claimblocks: 15
    desert_pyramid:
      xp: 100
      claimblocks: 12
    desert_well:
      xp: 110
      claimblocks: 13
    igloo:
      xp: 180
      claimblocks: 22
    jungle_temple:
      xp: 150
      claimblocks: 18
    ocean_ruin:
      xp: 80
      claimblocks: 10
    pillager_outpost:
      xp: 80
      claimblocks: 10
    ruined_portal:
      xp: 80
      claimblocks: 10
    shipwreck:
      xp: 80
      claimblocks: 10
    trail_ruins:
      xp: 200
      claimblocks: 25

# A crate for a region, village, heart, nerve, or soul the moment it is first recorded.
# A water discovery uses the region crate for that world.
# Turn this on to run command. {player} and {crate} are filled in when it is dispatched.
# CrazyCrates presents the reward.
discovery-crates:
  enabled: false
  command: "cc give virtual {crate} 1 {player}"

  rewards:
    overworld_region: RegionCrate
    nether_region: RegionCrate
    overworld_village: VillageCrate
    overworld_heart: HeartCrate
    nether_heart: HeartCrate
    overworld_nerve: NerveCrate
    overworld_soul: SoulCrate

# LuckPerms permission for an overworld region the moment it is first recorded.
# Turn this on to run command. {player} and {region} are filled in when it is dispatched.
# {player} is the name stored on the discovery. {region} is the region id, lowercased.
# The player is not notified.
region-books:
  enabled: false
  command: "lp user {player} permission set bookgui.book.{region} true"

# Short grass placed near a Heart can become a flower.
# Redstone ore mined near a Nerve can drop coal.
# An unlit candle placed near a Soul can light.
# The chance is highest at the site and falls to zero at the edge of its ellipsoid.
# Horizontal radius is X and Z. Vertical radius is Y. Both are in blocks.
# A Soul's Y is the top of that ellipsoid. Its vertical radius reaches downward.
# worlds.overworld is the Bukkit world folder.
# Sites are read from plugins/ExplorationCore/detection-sites.yml.
# A missing or bad site file leaves the grass, the ore, and the candles alone.
detection:
  enabled: true
  max-probability: 0.9
  falloff: 1.5

  worlds:
    overworld: world

  heart:
    horizontal-radius: 256
    vertical-radius: 64
    place: SHORT_GRASS
    become: POPPY

  nerve:
    horizontal-radius: 256
    vertical-radius: 32
    ores:
      - REDSTONE_ORE
      - DEEPSLATE_REDSTONE_ORE
    drop: COAL

  soul:
    horizontal-radius: 256
    vertical-radius: 128
