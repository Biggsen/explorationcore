name: ExplorationCore
version: "${version}"
main: dev.explorationcore.ExplorationCorePlugin
api-version: '1.21'
softdepend: [PlaceholderAPI, WorldGuard]
description: Persistent ledger of player exploration discoveries.
commands:
  explorationcore:
    description: Internal discovery ledger
    usage: /<command> <status|record>
  exploration:
    description: Open your exploration progress
    usage: /<command> [book [player]|guides [book [player]]|preview <scenario>]
    permission: explorationcore.exploration
  guides:
    description: Open the guides
    usage: /<command> [book [player]]
    permission: explorationcore.exploration
  atlas:
    description: Give an Exploration Atlas
    usage: /<command> book [player]
    permission: explorationcore.exploration
  cartographytest:
    description: Temporary cartography map validation
    usage: /<command>
    permission: explorationcore.cartographytest
    permission-message: You do not have permission to use this command.
permissions:
  explorationcore.record:
    description: Record one discovery into the ledger. Not granted to operators.
    default: false
  explorationcore.status:
    description: Show ExplorationCore database status.
    default: op
  explorationcore.exploration:
    description: Open the exploration progress book.
    default: true
  explorationcore.bookpreview:
    description: Open a sample exploration journal without exploring.
    default: op
  explorationcore.cartographytest:
    description: Inspect the filled map in your main hand.
    default: op
